name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum permissions: only need to read the repo to run tests.
# Each job can grant additional scopes if needed (none currently do).
permissions:
  contents: read

# Cancel an in-progress run when a new commit lands on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # uv.lock is gitignored in this repo; key the cache off pyproject.toml
          # so installs are still cached without forcing a lock file commit.
          cache-dependency-glob: pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # Includes [validation] (PR 5b of #112) so the strict-mode
        # tests in test_judge_revise_jsonschema.py and the strict
        # end-to-end tests in test_agent_judge_revise_dispatch.py
        # exercise the real jsonschema dependency.
        run: uv sync --extra dev --extra openai --extra validation --extra redis --extra http --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v --tb=short

  # NOTE on the load-time fail-loud gate (PR 5b of #112):
  #
  # An earlier draft of this workflow included a third job that ran
  # WITHOUT ``--extra validation`` against a real Python interpreter
  # and asserted ``parse_judges_md_text("validation: strict")`` raised
  # ``JudgePolicyInvalid`` with "not importable" in the message — i.e.,
  # pinning the load-time fail-loud guarantee operationally instead of
  # under a monkeypatched probe. That job is intentionally absent.
  #
  # Why: ``jsonschema`` is a transitive dependency of ``mcp>=1.0.0``
  # (which ``atomic_agents`` requires unconditionally), so the
  # "operator without jsonschema" scenario is unreachable in this
  # dependency tree. Uninstalling jsonschema would break ``mcp``
  # imports, which would crash the test script before it reached the
  # parser at all. Coverage of the gate's behavior lives in
  # ``tests/test_judges_md_parser.py::TestValidationField::test_strict_raises_when_jsonschema_missing``,
  # which monkeypatches ``_check_jsonschema_importable`` to simulate
  # the missing-import path — the realistic shape of the gate in this
  # ecosystem. If a future change drops the ``mcp`` requirement or
  # ``mcp`` drops its jsonschema dep, the real-interpreter negative-
  # path job can be re-added here.
