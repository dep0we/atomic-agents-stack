name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a new commit lands on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # uv.lock is gitignored in this repo; key the cache off pyproject.toml
          # so installs are still cached without forcing a lock file commit.
          cache-dependency-glob: pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # Includes [validation] (PR 5b of #112) so the strict-mode
        # tests in test_judge_revise_jsonschema.py and the strict
        # end-to-end tests in test_agent_judge_revise_dispatch.py
        # exercise the real jsonschema dependency.
        run: uv sync --extra dev --extra openai --extra validation --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v --tb=short

  test-load-time-gate-without-jsonschema:
    # NEGATIVE-PATH JOB (PR 5b of #112). Installs WITHOUT the
    # [validation] extra, then exercises the parser's load-time gate
    # against a real Python interpreter — NOT a monkeypatched probe.
    # An agent built around a judges.md with validation: strict MUST
    # refuse to construct when jsonschema is not installed. This is
    # the operational guarantee operators rely on; the test job pins
    # it.
    name: load-time gate raises without jsonschema (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies WITHOUT [validation] extra
        run: uv sync --extra dev --extra openai --python 3.12

      - name: Confirm jsonschema is not importable
        run: |
          set -e
          if uv run --python 3.12 python -c "import jsonschema" 2>/dev/null; then
            echo "ERROR: jsonschema is importable but the negative-path job requires it absent."
            exit 1
          fi
          echo "OK: jsonschema is not importable as required."

      - name: Assert validation:strict + missing extra raises JudgePolicyInvalid
        run: |
          uv run --python 3.12 python - <<'PY'
          import sys
          from atomic_agents.judges_md import parse_judges_md_text
          from atomic_agents.exceptions import JudgePolicyInvalid

          text = "```yaml\nvalidation: strict\n```\n"
          try:
              parse_judges_md_text(text)
          except JudgePolicyInvalid as exc:
              msg = str(exc)
              if "not importable" not in msg:
                  print(f"UNEXPECTED MESSAGE: {msg}", file=sys.stderr)
                  sys.exit(2)
              print(f"OK: parser raised JudgePolicyInvalid as required: {msg}")
              sys.exit(0)
          print("ERROR: parser accepted validation:strict without [validation] extra", file=sys.stderr)
          sys.exit(1)
          PY
