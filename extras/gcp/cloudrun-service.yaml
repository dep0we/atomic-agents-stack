# cloudrun-service.yaml - atomic-agents-stack on Cloud Run (stateless v0)
#
# NOT YET DOGFOODED against the live GCP platform.
# Claims verified against GCP documentation as of 2026-06-09.
# See extras/gcp/README.md §External-claim verification status.
#
# v0 Cloud Run topology: STATELESS.
# Cloud Run v2 does not support GCE persistent disk volumes. The original
# v0 blueprint (issue #339) included gce-persistent-disk volume blocks that
# do not exist in the Cloud Run v2 Volume schema - the valid types are
# secret, cloudSqlInstance, emptyDir, nfs, and gcs. None of those satisfy
# POSIX rename(2) atomicity (TENSIONS.md T4), so Cloud Run v0 is explicitly
# stateless: mutable state lands in the ephemeral container writable layer
# and is LOST on container replacement.
#
# For a stateful-today deployment with a real ext4/xfs persistent disk, see
# extras/gcp/compute-vm/ (Compute Engine VM reference).
#
# DURABILITY SUMMARY:
#   Durable today (active in this manifest): Locks (Redis, #60) - the lock
#                      backend env vars are uncommented below.
#   Durable when activated: Run logs (PostgresLogBackend, #258) - the log
#                      backend env vars are COMMENTED OUT below, so the default
#                      is FilesystemLogBackend writing to the ephemeral
#                      container layer. Uncomment them to make run logs durable.
#   Ephemeral today:   Memory | Goals | Outcomes | Journal | Cascade queue |
#                      Mandate | Policy | Profile | Tool-registry | Corpus
#   Config (not state): Baked into the container image - never moves.
#
# runAsNonRoot: the Dockerfile adds USER 10001 (see extras/gcp/Dockerfile).
# Cloud Run fully-managed does not enforce runAsNonRoot via the Knative
# manifest spec; the Dockerfile USER directive is what is effective.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: <your-agent-name>
  namespace: <your-project-id>
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    # IAP is configured at the backend service level, not here.
    # See extras/gcp/iap-setup.md.
spec:
  template:
    metadata:
      annotations:
        # min-instances=1 recommended: a cold start takes 2-8s before the
        # healthz probe passes; Cloud Scheduler jobs that fire during this
        # window see HTTP 503 and retry (risk: duplicate trigger pile-up per
        # cloudscheduler-jobs.yaml.example §retryConfig). Set to 0 only if
        # you accept cold-start latency and configure retryCount=0 on all
        # Scheduler jobs. This constraint is cost vs. availability, not state
        # durability - Cloud Run v0 is stateless.
        autoscaling.knative.dev/minScale: "1"
        # max-instances=1 in v0: the default FilesystemLockBackend uses
        # fcntl.flock (single-host advisory locking; atomic_agents/locks/
        # filesystem.py), which does NOT coordinate across hosts. Two Cloud Run
        # instances do not share a host or filesystem, so neither sees the
        # other's lock; concurrent same-agent requests across instances would
        # race on ephemeral filesystem state (memory/, journal/, etc.) that is
        # NOT yet backed by any distributed store. (The Redis LockBackend
        # coordinates across instances, but the ephemeral-state race remains
        # until those surfaces move to cloud backends.) This constraint lifts
        # when all mutable surfaces move to multi-writer-safe cloud backends
        # (Phase 4). For the Compute Engine VM equivalent, see
        # extras/gcp/compute-vm/.
        autoscaling.knative.dev/maxScale: "1"

    spec:
      # containerConcurrency=1: the default FilesystemLockBackend uses
      # fcntl.flock (atomic_agents/locks/filesystem.py), which serializes
      # same-agent writers WITHIN a single instance (same host).
      # With Cloud Run's default concurrency of 80,
      # 80 concurrent same-agent requests from a single instance queue on the
      # 30s lock timeout and saturate the bounded serve thread pool
      # (~min(32, cpu_count+4) per docs/deployment/serve.md
      # §Thread-pool saturation). Setting concurrency=1 makes the bottleneck
      # visible and honest - requests queue at Cloud Run, not inside the
      # container. Raise only after verifying the serving topology handles
      # concurrent same-agent requests safely (Phase 4+). See TENSIONS.md T2.
      containerConcurrency: 1

      containers:
        - image: gcr.io/<your-project-id>/<your-agent-name>:latest
          # Pin the container port explicitly. When containerPort is declared,
          # Cloud Run injects PORT=8080 (it honors the declared port), so the
          # CMD's `--port ${PORT:-8080}` binds to 8080 and the probe ports below
          # (also 8080) match. Without this pin, Cloud Run MAY inject a
          # different PORT, the app would bind there, and the hardcoded probes
          # would target a dead port - failing liveness and crash-looping.
          # If you change this value, change the probe ports to match.
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: "1"

          env:
            # Agent vault root - all mutable state writes go to this directory.
            # On stateless Cloud Run v0, this path is on the container's
            # ephemeral writable layer. State is LOST on container replacement.
            - name: ATOMIC_AGENTS_ROOT
              value: /app/agents

            # Lock backend: Redis (shipped, issue #60).
            # Activate with the env vars below; leave unset for filesystem fallback.
            # Install: pip install 'atomic-agents-stack[redis]' (include in Dockerfile).
            - name: ATOMIC_AGENTS_LOCK_BACKEND
              value: redis
            - name: ATOMIC_AGENTS_LOCK_BACKEND_URL
              # Inject from Secret Manager at deploy time:
              #   gcloud run services update ... \
              #     --set-secrets ATOMIC_AGENTS_LOCK_BACKEND_URL=redis-url:latest
              value: ""  # set via --set-secrets at deploy time

            # Log backend: Postgres/Cloud SQL (issue #258, PR 1 - PostgresLogBackend shipped).
            # To activate: uncomment the two env vars below and supply the DSN
            # via --set-secrets. Requires atomic-agents-stack[postgres] in the
            # Dockerfile pip line (add "postgres" to the extras list).
            # Leave unset to use FilesystemLogBackend (writes to ephemeral
            # container layer - run logs are LOST on container replacement
            # when left on the default FilesystemLogBackend).
            # - name: ATOMIC_AGENTS_LOG_BACKEND
            #   value: postgres
            # - name: ATOMIC_AGENTS_LOG_BACKEND_URL
            #   value: ""  # set via --set-secrets

            # Secrets: two supported paths (GCPSecretManagerBackend shipped at
            # #340 PR 2, spec/38 LOCKED).
            # PATH 1 (simplest) - inject credentials as Cloud Run env vars. The
            # FilesystemSecretBackend (default) probes env vars first, so injected
            # values are picked up with no ATOMIC_AGENTS_SECRET_BACKEND needed:
            #   gcloud run services update ... \
            #     --set-secrets ANTHROPIC_API_KEY=anthropic-api-key:latest
            #
            # PATH 2 - resolve secrets live from Secret Manager at call time
            # (rotation visible next run, no redeploy). Requires the [gcp] extra
            # and both env vars:
            #   --set-env-vars ATOMIC_AGENTS_SECRET_BACKEND=gcp
            #   --set-env-vars ATOMIC_AGENTS_SECRET_BACKEND_URL=projects/<project-id>/secrets
            # See extras/gcp/secret-manager-bootstrap.sh and
            # docs/deployment/secret-backend.md for the full guide.

            # Don't set ATOMIC_AGENTS_SERVE_PORT here. The CMD's `--port` CLI
            # flag takes precedence over this env var (resolution order:
            # CLI > env > serve.md > default, per serve/_server.py), so the env
            # var would do nothing but add a confusing redundant override while
            # the flag is present. The CMD already binds the right port via
            # `--port ${PORT:-8080}`. See docs/deployment/serve.md §"Cloud Run
            # entrypoint example".

          # EPHEMERAL STATE ANNOTATIONS (Cloud Run v0, stateless):
          # The following directories exist in the container image as an empty
          # skeleton baked in by the Dockerfile COPY. They are writable via the
          # container's ephemeral writable layer. State written here is LOST on
          # every container replacement / redeploy / cold start.
          #
          # No volumeMounts are configured - Cloud Run v2 does not support GCE
          # persistent disk volumes. See extras/gcp/README.md
          # §"Why no disk on v0 Cloud Run" and extras/gcp/compute-vm/ for the
          # stateful-today alternative.
          #
          # Per-surface durability status:
          #   memory/       EPHEMERAL - the MemoryBackend operator override seam shipped
          #                 (#382 PR 1), but only filesystem is registered today, so
          #                 FilesystemMemoryBackend writes here. Durable once the Postgres
          #                 MemoryBackend adapter ships (#258, Phase 2); until then
          #                 ATOMIC_AGENTS_MEMORY_BACKEND=postgres fails fast with
          #                 BackendNotRegistered.
          #   log/          EPHEMERAL - activate PostgresLogBackend (#258, shipped) to make
          #                 run logs durable. Default FilesystemLogBackend writes here.
          #   journal/      EPHEMERAL - no Protocol yet; no cloud adapter possible until
          #                 #383 ships (Phase 3).
          #   goals/        EPHEMERAL - no Protocol yet; #383 (Phase 3).
          #   outcomes/     EPHEMERAL - no Protocol yet; #383 (Phase 3).
          #   dreams/       EPHEMERAL - operator-triggered dream artifacts
          #                 (<agent_root>/dreams/<id>/, atomic_agents/dream.py);
          #                 no Protocol yet; #383 (Phase 3).
          #   queue/        EPHEMERAL - cascade work-queue (queued/claimed/done/
          #                 dead-letter); the POSIX-rename work-claim leases live here
          #                 (atomic_agents/_cascade.py). Present ONLY in multi-agent
          #                 cascade project deployments, where it lives at
          #                 project_root/queue/ - NOT a sibling of memory/ under a
          #                 single agent's folder root. A single-agent
          #                 "serve <agent-name>" deployment (this manifest's shape) has
          #                 no queue/ at the agent root. No Protocol yet; #383 + T4 (Phase 3).
          #   mandate/      EPHEMERAL - Postgres adapter tracked in #258 (Phase 3).
          #   policy/       EPHEMERAL - Postgres adapter tracked in #258 (Phase 3).
          #   profile/      EPHEMERAL - Postgres adapter tracked in #258 (Phase 3).
          #   tools/        EPHEMERAL - Postgres adapter tracked in #258 (Phase 3).
          #   corpus/       EPHEMERAL - Postgres adapter tracked in #258 (Phase 3).
          #   .personas/    EPHEMERAL - persona-backend storage (FilesystemPersonaBackend,
          #                 <root>/.personas/<persona_id>/); gated on the PersonaBackend
          #                 cloud adapter, #258 (Phase 3). NOT cascade work-claim leases.
          #   idempotency/  EPHEMERAL - FilesystemDedupLedger (spec/45; #520). Dedup
          #                 lease (*.lease.json) and terminal (*.terminal.json) files
          #                 live here. LOST on container replacement — a redelivered
          #                 message arriving after restart sees FRESH and re-runs.
          #                 Dedup-across-restarts requires Redis/Postgres IdempotencyBackend.
          #                 On the VM topology (persistent disk): stale *.lease.json files
          #                 from a crashed run require manual removal (TTL sweep deferred;
          #                 spec/45 supports_ttl=False). See extras/gcp/README.md
          #                 §Troubleshooting for the stale-lease recovery command.
          #
          # For the LAYOUT RULE (never mount at the agent folder root - see why in
          # extras/gcp/compute-vm/README.md §CRITICAL LAYOUT RULE), which applies
          # when mounts are eventually added in Phase 4.

          # Probe port MUST equal the declared containerPort above (8080).
          # If you change containerPort, change both probe ports too.
          livenessProbe:
            httpGet:
              path: /agents/<your-agent-name>/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            # Do NOT use /agents/<name>/doctor as the liveness probe.
            # doctor may spawn MCP subprocesses and probe remote backends.
            # healthz runs filesystem checks only. See docs/deployment/serve.md.

          # NO readinessProbe here on purpose. Cloud Run readiness probes are a
          # Preview feature: the YAML form REQUIRES the
          # `run.googleapis.com/launch-stage: BETA` annotation on
          # spec.template.metadata (and `gcloud beta run deploy --readiness-probe`),
          # or `gcloud run services replace` rejects/drops the unannotated field.
          # (Verified: the readinessProbe example mandates that annotation at
          #  https://cloud.google.com/run/docs/configuring/healthchecks)
          # A stateless v0 reference only needs the GA livenessProbe above to be
          # honestly deployable - healthz is already the liveness path. If you want
          # a readiness probe, add `run.googleapis.com/launch-stage: BETA` to
          # spec.template.metadata.annotations and deploy with `gcloud beta`.
